services:

  frontend:
    image: ${DOCKERHUB_USERNAME}/healthcare-frontend:${IMAGE_TAG}
    container_name: healthcare-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - healthcare-network

  backend:
    image: ${DOCKERHUB_USERNAME}/healthcare-backend:${IMAGE_TAG}
    container_name: healthcare-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - healthcare-network

  database:
    image: ${DOCKERHUB_USERNAME}/healthcare-database:${IMAGE_TAG}
    container_name: healthcare-database
    restart: unless-stopped
    ports:
      - "3307:3306"
    networks:
      - healthcare-network

networks:
  healthcare-network:
    driver: bridge
